<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Management MVP</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 40px; color: #032147; }
      p { color: #888888; }
    </style>
  </head>
  <body>
    <h1>Hello world</h1>
    <p>Static page served by FastAPI.</p>
    <p>API says: <strong id="api-message">loading...</strong></p>
    <script>
      fetch("/api/hello")
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("api-message").textContent = data.message;
        })
        .catch(() => {
          document.getElementById("api-message").textContent = "API call failed";
        });
    </script>
  </body>
</html>
